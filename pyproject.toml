[project]
name = "congress-warehouse"
version = "0.1.0"
description = "A tested analytical warehouse of historical US congressional votes and elections."
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "dbt-core",
    "dbt-duckdb",
    "httpx",
    "pyyaml",
    "pyarrow",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]